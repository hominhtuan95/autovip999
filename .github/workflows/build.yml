name: Build Auto Train Mil Co Mo HWID EXE
on:
  workflow_dispatch:
  push:
    paths:
      - 'Auto_Train_Mil_Co_Mo.py'
      - 'license_core.py'
      - 'nhan_vat.png'
      - '.github/workflows/build.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pyinstaller pillow numpy cryptography
      - name: Verify public key
        shell: pwsh
        run: |
          python -c "import license_core; assert len(bytes.fromhex(license_core.PUBLIC_KEY_HEX)) == 32, 'Run setup_license.py locally and upload license_core.py'"
          python -m py_compile Auto_Train_Mil_Co_Mo.py license_core.py
      - name: Build EXE
        run: python -m PyInstaller --clean --onefile --windowed --name Auto_Train_Mil_Co_Mo --add-data "nhan_vat.png;." --collect-submodules cryptography Auto_Train_Mil_Co_Mo.py
      - uses: actions/upload-artifact@v4
        with:
          name: Auto_Train_Mil_Co_Mo_HWID_EXE
          path: dist/Auto_Train_Mil_Co_Mo.exe
